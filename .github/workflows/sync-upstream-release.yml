name: 同步上游并发布 OPPO 定制包

# 上游（pengchujin/aerial-tv）发新 release 后，这里自动：
#   1. 拉上游那个 tag 的源码（干干净净的一份，从不复用上次的目录）
#   2. custom/apply.py 打上全部 OPPO 定制
#   3. 只编 standard flavor，用本仓库密钥 v1+v2 签名，版本号跟上游 tag
#   4. 发一个和上游同 tag 的 release：aerial-standard.apk + version.txt
#
# fork 收不到上游的 release 事件，所以定时轮询（每小时一次）。也可以在 Actions 页手动跑。
# 每小时而不是每 6 小时：上游一天能发好几个版本，6 小时一轮最坏要等 6 小时才跟上。
# 已经做过的版本会走到「取上游最新 release」就 skip 掉，根本不编译，所以跑得勤几乎不要钱。
# 手动跑可以指定 tag、勾 force 重建一个已经存在的 release、或者填一段自己的版本描述。
#
# 不加 push 触发：这个仓库的文件是在网页上逐个上传的，每传一个都是一次 push，
# 会在「补丁只传了一半」的状态下就把 CI 跑起来，红一次再红一次，纯噪音。
# 想立刻验证就传完所有文件后到 Actions 页手动 Run 一次；不定时也会自己跑。

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "上游 tag（例如 v1.46）；留空则自动取上游最新正式 release"
        required: false
        default: ""
      force:
        description: "本仓库已有该 tag 也重建（覆盖附件）"
        type: boolean
        default: false
      notes:
        description: "自定义版本描述（留空用默认模板）。输入框只有一行，换行请写 \\n；支持 Markdown"
        required: false
        default: ""
      keep_upstream:
        description: "自定义描述时，末尾仍附上上游原文"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

env:
  UPSTREAM: pengchujin/aerial-tv
  MINE: ${{ github.repository }}
  PLATFORM: android-36
  BUILD_TOOLS: 36.0.0
  APK_PACKAGE: com.oneplus.tv.launcher2
  # 一个签名密钥只能一台机器一个进程地跑，且 CI 上没必要留守护进程耗内存。
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # ---------------------------------------------------------------- 看上游
      - name: 取上游最新 release
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
          NOTES: ${{ inputs.notes }}
          KEEP_UPSTREAM: ${{ inputs.keep_upstream }}
        run: |
          set -euo pipefail
          tag="${TAG_IN:-}"
          if [ -z "$tag" ]; then
            # latest 会跳过 prerelease；取不到（上游只发了 beta）就退到列表第一条。
            tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name 2>/dev/null || true)
            [ -n "$tag" ] || tag=$(gh api "repos/$UPSTREAM/releases?per_page=1" --jq '.[0].tag_name')
          fi
          [ -n "$tag" ] || { echo "拿不到上游 tag" >&2; exit 1; }
          echo "上游最新：$tag"

          # 先把上游那一版 release 取下来：标题、原文、是否 prerelease，拼版本描述要用，
          # 所以放在「已经有完整包就跳过」之前——跳过时也可能要改描述。
          gh api "repos/$UPSTREAM/releases/tags/$tag" > "$RUNNER_TEMP/upstream.json"
          jq -r '.name // .tag_name' "$RUNNER_TEMP/upstream.json" > "$RUNNER_TEMP/release-title.txt"
          jq -r '.body // ""'       "$RUNNER_TEMP/upstream.json" > "$RUNNER_TEMP/release-notes.md"
          jq -r '.prerelease'       "$RUNNER_TEMP/upstream.json" > "$RUNNER_TEMP/prerelease.txt"

          # 版本描述只在这里算一次，发布那一步直接用 $RUNNER_TEMP/notes.md。
          # 填了 notes 就用你写的那份（输入框只有一行，\n 在这里还原成换行）；
          # 没填就沿用默认模板：定制说明 + 上游原文。
          if [ -n "${NOTES:-}" ]; then
            printf '%b\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
            if [ "${KEEP_UPSTREAM}" = "true" ] && [ -s "$RUNNER_TEMP/release-notes.md" ]; then
              {
                echo ""
                echo "---"
                echo ""
                echo "以下是上游原文："
                echo ""
                cat "$RUNNER_TEMP/release-notes.md"
              } >> "$RUNNER_TEMP/notes.md"
            fi
            echo "用自定义版本描述（$(wc -l < "$RUNNER_TEMP/notes.md") 行）："
            sed 's/^/  | /' "$RUNNER_TEMP/notes.md"
          else
            {
              echo "OPPO / OnePlus 电视定制包：包名 \`$APK_PACKAGE\`，带 \`MODERN_HOME\`，"
              echo "本仓库密钥签名（v1 + v2），只编 standard flavor。功能与上游 \`$tag\` 一致。"
              echo ""
              echo "安装：电视上直接安装即可覆盖旧版（签名相同），或 \`adb install -r aerial-standard.apk\`。"
              echo ""
              echo "---"
              echo ""
              echo "以下是上游原文："
              echo ""
              cat "$RUNNER_TEMP/release-notes.md"
            } > "$RUNNER_TEMP/notes.md"
          fi

          # 只有「release 存在 + 两个附件都在」才算做完了，缺一个就补。
          done_repo=""
          if assets=$(gh release view "$tag" --repo "$MINE" --json assets --jq '.assets[].name' 2>/dev/null); then
            if grep -qx "aerial-standard.apk" <<< "$assets" && grep -qx "version.txt" <<< "$assets"; then
              done_repo=yes
            fi
          fi
          if [ -n "$done_repo" ] && [ "$FORCE" != "true" ]; then
            if [ -n "${NOTES:-}" ]; then
              # 包已经完整，只是想把版本描述换掉：改完就走，不重新编译。
              gh release edit "$tag" --repo "$MINE" --notes-file "$RUNNER_TEMP/notes.md"
              echo "本仓库的 $tag 已经完整，只替换了版本描述。"
            else
              echo "本仓库已经有完整的 $tag，什么都不做。"
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.up.outputs.skip == 'false'
        with:
          fetch-depth: 1

      - name: 下载上游源码
        if: steps.up.outputs.skip == 'false'
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          # 不静默到一点输出都没有：网络慢时这一步能静止半分钟，看着像卡死。
          echo "开始下载 $TAG 的源码（约 20 MB）..."
          curl -fsSL --retry 5 --retry-delay 3 --max-time 600 \
            "https://codeload.github.com/$UPSTREAM/tar.gz/refs/tags/$TAG" -o "$RUNNER_TEMP/src.tgz"
          echo "下载完成：$(ls -lh "$RUNNER_TEMP/src.tgz" | awk '{print $5}')"
          tar xzf "$RUNNER_TEMP/src.tgz" -C "$RUNNER_TEMP/src" --strip-components=1
          grep -E '^\s+(versionCode|versionName) = ' "$RUNNER_TEMP/src/app/build.gradle.kts"

      - name: 打上 OPPO 定制
        if: steps.up.outputs.skip == 'false'
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          python3 custom/apply.py "$RUNNER_TEMP/src" \
            --version "${TAG#v}" \
            --repo "$MINE"

      # 把打完补丁的源码推到 src/<tag> 分支，方便在网页上直接对照看改了什么。
      # 必须放在写签名密钥之前：否则 keystore 会跟着被推上去。
      - name: 记录同步后的源码
        if: steps.up.outputs.skip == 'false'
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/src"
          test ! -e local || { echo "local/ 不该存在，拒绝提交" >&2; exit 1; }
          git init -q
          git add -A
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" \
              commit -qm "Aerial $TAG + OPPO 定制"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/$MINE.git" \
            "HEAD:refs/heads/src/$TAG"

      # ---------------------------------------------------------------- 编译环境
      - uses: actions/setup-java@v5
        if: steps.up.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: "17"

      # 只让它准备 cmdline-tools + platform-tools（它的本职工作）。
      # platform / build-tools 放到下一步自己装：那一步会打印 sdkmanager 版本、失败重试，
      # 并且装完实地检查目录——sdkmanager 有个坑，找不到包时只打 warning，退出码却是 0。
      # 也顺便避开了 v3 的致命默认值：v3 默认要装 `tools` 包，而这个包 Google 早已下架，
      # 于是每次都在这里报 "Failed to find package 'tools'" 然后 exit 1。v4 的默认值已不含它。
      - uses: android-actions/setup-android@v4
        if: steps.up.outputs.skip == 'false'
        continue-on-error: true
        with:
          cmdline-tools-version: 15859902 # 22.0；API 36 要够新的 sdkmanager 才认得包名
          packages: "platform-tools"

      - name: 安装 SDK 组件 platforms / build-tools
        if: steps.up.outputs.skip == 'false'
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"

          # action 成功时 sdkmanager 已在 PATH；失败时自己从 cmdline-tools/*/bin 里找。
          if ! command -v sdkmanager >/dev/null 2>&1; then
            found=""
            # latest 优先：老版本 sdkmanager 认不出 API 36 的包名，会「warning + 退出码 0」，
            # 那种失败最难查，所以宁可先挑最新的。
            for d in "$ANDROID_HOME"/cmdline-tools/latest/bin "$ANDROID_HOME"/cmdline-tools/*/bin; do
              if [ -x "$d/sdkmanager" ]; then PATH="$d:$PATH"; found="$d"; break; fi
            done
            if [ -z "$found" ]; then
              echo "::error::找不到 sdkmanager，$ANDROID_HOME 下也没有 cmdline-tools"
              ls -a "$ANDROID_HOME" 2>/dev/null || true
              exit 1
            fi
            echo "$found" >> "$GITHUB_PATH"
            echo "改用 $found 里的 sdkmanager"
          fi
          echo "sdkmanager 版本：$(sdkmanager --version 2>&1 || echo 未知)"

          yes 2>/dev/null | sdkmanager --licenses > /dev/null || true

          ok=0
          for i in 1 2 3; do
            echo "--- sdkmanager 第 $i 次尝试 ---"
            if sdkmanager --install "platforms;$PLATFORM" "build-tools;$BUILD_TOOLS" "platform-tools"; then
              ok=1
              break
            fi
            echo "失败，10 秒后重试"
            sleep 10
          done
          [ "$ok" = 1 ] || echo "::error::sdkmanager 三次都没成功，下面看具体缺什么"

          # 只看目录有没有落地：sdkmanager 找不到包时可能 warning 一下就返回 0。
          missing=0
          [ -d "$ANDROID_HOME/platforms/$PLATFORM" ]     || { echo "::error::缺 platforms/$PLATFORM"; missing=1; }
          [ -d "$ANDROID_HOME/build-tools/$BUILD_TOOLS" ] || { echo "::error::缺 build-tools/$BUILD_TOOLS"; missing=1; }
          if [ "$missing" = 1 ]; then
            echo "已安装的组件："
            sdkmanager --list_installed 2>/dev/null | sed -n '1,40p' || true
            echo "仓库里 3x 相关的包（用来核对包名到底存不存在）："
            sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[0-9]|build-tools;3[0-9]" | tail -20 || true
            exit 1
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: 缓存 Gradle
        if: steps.up.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('custom/apply.py', 'custom/files/*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 写入签名密钥
        if: steps.up.outputs.skip == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.AERIAL_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.AERIAL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AERIAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AERIAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "缺少 secret：$v（Settings → Secrets and variables → Actions）" >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/src/local"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/src/local/aerial.keystore"
          {
            printf 'storeFile=aerial.keystore\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "$RUNNER_TEMP/src/local/signing.properties"

      - name: 编译 standard release
        if: steps.up.outputs.skip == 'false'
        working-directory: ${{ runner.temp }}/src
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleStandardRelease --no-daemon --console=plain

      # ---------------------------------------------------------------- 校验
      - name: 校验包名、版本号、v1+v2 与证书指纹
        if: steps.up.outputs.skip == 'false'
        env:
          TAG: ${{ steps.up.outputs.tag }}
          WANT_CERT: ${{ vars.AERIAL_CERT_SHA256 }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          apk="$RUNNER_TEMP/src/app/build/outputs/apk/standard/release/app-standard-release.apk"
          test -f "$apk" || { echo "没编出 $apk" >&2; exit 1; }

          # aapt2 有些版本不带 dump badging，回退到 aapt。
          badging=$("$bt/aapt2" dump badging "$apk" 2>/dev/null) ||
            badging=$("$bt/aapt" dump badging "$apk")
          pkg=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          ver=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          echo "包名 $pkg，版本 $ver"
          [ "$pkg" = "$APK_PACKAGE" ] || { echo "包名不对：$pkg" >&2; exit 1; }
          [ "$ver" = "${TAG#v}" ] || { echo "版本号不对：$ver，上游是 ${TAG#v}" >&2; exit 1; }

          out=$("$bt/apksigner" verify -v --print-certs "$apk")
          printf '%s\n' "$out" | grep -E "^Verified using v[12] scheme"
          printf '%s\n' "$out" | grep -q "Verified using v1 scheme (JAR signing): true" || { echo "v1 签名缺失：OPPO 安装器会拒绝" >&2; exit 1; }
          printf '%s\n' "$out" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" || { echo "v2 签名缺失" >&2; exit 1; }

          # 电视上已有的旧包是某一把密钥签的，换密钥就只能卸载重装。
          # 配了仓库变量 AERIAL_CERT_SHA256 就强制核对，没配只打印。
          cert=$(printf '%s\n' "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "证书 SHA-256：$cert"
          if [ -n "${WANT_CERT:-}" ] && [ "$cert" != "$WANT_CERT" ]; then
            echo "证书指纹与 AERIAL_CERT_SHA256 不一致——这个包装不到现有的电视上，检查 secret 里的 keystore" >&2
            exit 1
          fi

          cp "$apk" "$RUNNER_TEMP/aerial-standard.apk"
          printf '%s' "${TAG#v}" > "$RUNNER_TEMP/version.txt"

      # ---------------------------------------------------------------- 发布
      - name: 发布 release
        if: steps.up.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # notes.md 在「取上游最新 release」那一步就写好了：填了 notes 就是你那份（可带\n），
          # 没填是默认模板 + 上游原文。这里只管发，不再拼一遍，免得两边写法跑偏。
          echo "版本描述："
          sed 's/^/  | /' notes.md

          flags=()
          if [ "$(cat prerelease.txt)" = "true" ]; then flags+=(--prerelease); fi

          if gh release view "$TAG" --repo "$MINE" > /dev/null 2>&1; then
            gh release upload "$TAG" aerial-standard.apk version.txt --repo "$MINE" --clobber
            gh release edit "$TAG" --repo "$MINE" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$TAG" aerial-standard.apk version.txt \
              --repo "$MINE" \
              --title "$(cat release-title.txt)" \
              --notes-file notes.md \
              "${flags[@]}"
          fi
          echo "已发布：https://github.com/$MINE/releases/tag/$TAG"
